<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <style>
      .badge-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 8px; }
      .badge-text { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 26px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .brand-title { font-family: Georgia, Lora, "Times New Roman", serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .brand-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; letter-spacing: 0.2px; }
    </style>
  </defs>

  <!-- Logo Badge: [ |=| ] -->
  <g transform="translate(10, 25)">
    <rect class="badge-bg" x="0" y="0" width="62" height="62" rx="10" />
    <text class="badge-text" x="31" y="32">|=| </text>
  </g>

  <!-- Typography: Hawcoder & Tagline -->
  <g transform="translate(86, 25)">
    <text class="brand-title" x="0" y="36">Hawcoder</text>
    <text class="brand-subtitle" x="0" y="58">Hawassa • AddisCoder 2026 Alumni</text>
  </g>
</svg>
